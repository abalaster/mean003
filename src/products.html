<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products and Services</title>
    <link rel="stylesheet" href="nav.css">
</head>
<body>
    <header>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About Us</a>
            <a href="/blog">Blog</a>
            <a href="/products">Products and Services</a>
            <a href="/profile" class="profile-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>Account Profile</a>
        </nav>
    </header>
    <main>
        <h1>Products and Services</h1>
        <p>Movie catalog from sample_mflix — <span id="movie-count"></span> titles, sorted alphabetically.</p>
        <div id="movie-list"></div>
        <div id="loading" style="text-align: center; padding: 20px; display: none;">
            <p>Loading more movies...</p>
        </div>
        <div id="end-message" style="text-align: center; padding: 20px; display: none;">
            <p>All movies loaded.</p>
        </div>
    </main>
    <div id="alpha-nav">
        <a href="#" data-letter="#">#</a>
        <a href="#" data-letter="A">A</a>
        <a href="#" data-letter="B">B</a>
        <a href="#" data-letter="C">C</a>
        <a href="#" data-letter="D">D</a>
        <a href="#" data-letter="E">E</a>
        <a href="#" data-letter="F">F</a>
        <a href="#" data-letter="G">G</a>
        <a href="#" data-letter="H">H</a>
        <a href="#" data-letter="I">I</a>
        <a href="#" data-letter="J">J</a>
        <a href="#" data-letter="K">K</a>
        <a href="#" data-letter="L">L</a>
        <a href="#" data-letter="M">M</a>
        <a href="#" data-letter="N">N</a>
        <a href="#" data-letter="O">O</a>
        <a href="#" data-letter="P">P</a>
        <a href="#" data-letter="Q">Q</a>
        <a href="#" data-letter="R">R</a>
        <a href="#" data-letter="S">S</a>
        <a href="#" data-letter="T">T</a>
        <a href="#" data-letter="U">U</a>
        <a href="#" data-letter="V">V</a>
        <a href="#" data-letter="W">W</a>
        <a href="#" data-letter="X">X</a>
        <a href="#" data-letter="Y">Y</a>
        <a href="#" data-letter="Z">Z</a>
    </div>
    <style>
        #alpha-nav {
            position: fixed;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.95);
            border: 1px solid #ccc;
            border-radius: 14px;
            padding: 4px 2px;
            z-index: 100;
        }
        #alpha-nav a {
            display: block;
            width: 24px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: #555;
            text-decoration: none;
            border-radius: 4px;
        }
        #alpha-nav a:hover {
            background: #333;
            color: #fff;
        }
        #alpha-nav a.active {
            background: #2a7a2a;
            color: #fff;
        }
        .movie-card {
            display: flex;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 12px;
            padding: 12px;
            background: #fff;
        }
        .movie-card img {
            width: 80px;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 15px;
            flex-shrink: 0;
            background: #eee;
        }
        .movie-info h3 {
            margin: 0 0 6px 0;
            font-size: 1.1em;
        }
        .movie-info p {
            margin: 3px 0;
            font-size: 0.9em;
            color: #555;
        }
        .movie-meta {
            font-size: 0.85em;
            color: #888;
        }
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 50px 0 15px;
        }
    </style>
    <script src="bundle.js"></script>
    <script>
        (function () {
            var currentPage = 1;
            var loading = false;
            var allLoaded = false;
            var movieList = document.getElementById('movie-list');
            var loadingEl = document.getElementById('loading');
            var endMessage = document.getElementById('end-message');
            var countEl = document.getElementById('movie-count');

            function escapeHtml(text) {
                if (!text) return '';
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function renderMovie(movie) {
                var card = document.createElement('div');
                card.className = 'movie-card';

                var posterSrc = movie.poster || '';
                var imgHtml = posterSrc
                    ? '<img src="' + escapeHtml(posterSrc) + '" alt="' + escapeHtml(movie.title) + '">'
                    : '<img src="" alt="No poster" style="background:#ccc;">';

                var genres = (movie.genres || []).join(', ') || 'N/A';
                var year = movie.year || 'N/A';
                var rated = movie.rated || 'N/A';
                var runtime = movie.runtime ? movie.runtime + ' min' : 'N/A';
                var imdbRating = (movie.imdb && movie.imdb.rating) ? movie.imdb.rating + '/10' : 'N/A';
                var plot = movie.plot || 'No description available.';

                card.innerHTML = imgHtml +
                    '<div class="movie-info">' +
                        '<h3>' + escapeHtml(movie.title) + '</h3>' +
                        '<p class="movie-meta">' + escapeHtml(String(year)) + ' &middot; ' + escapeHtml(rated) + ' &middot; ' + escapeHtml(runtime) + ' &middot; IMDb: ' + escapeHtml(imdbRating) + '</p>' +
                        '<p class="movie-meta">Genres: ' + escapeHtml(genres) + '</p>' +
                        '<p>' + escapeHtml(plot) + '</p>' +
                    '</div>';

                return card;
            }

            function loadMovies() {
                if (loading || allLoaded) return;
                loading = true;
                loadingEl.style.display = 'block';

                fetch('/api/movies?page=' + currentPage + '&limit=20')
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        if (currentPage === 1 && data.total) {
                            countEl.textContent = data.total.toLocaleString();
                        }

                        data.movies.forEach(function (movie) {
                            movieList.appendChild(renderMovie(movie));
                        });

                        loadingEl.style.display = 'none';
                        loading = false;

                        if (currentPage >= data.totalPages || data.movies.length === 0) {
                            allLoaded = true;
                            endMessage.style.display = 'block';
                        } else {
                            currentPage++;
                        }
                    })
                    .catch(function () {
                        loadingEl.style.display = 'none';
                        loading = false;
                    });
            }

            window.addEventListener('scroll', function () {
                if (allLoaded || loading) return;
                var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                var windowHeight = window.innerHeight;
                var docHeight = document.documentElement.scrollHeight;
                if (scrollTop + windowHeight >= docHeight - 300) {
                    loadMovies();
                }
            });

            loadMovies();

            document.getElementById('alpha-nav').addEventListener('click', function (e) {
                if (e.target.tagName !== 'A') return;
                e.preventDefault();
                var letter = e.target.getAttribute('data-letter');
                if (!letter) return;

                var links = document.querySelectorAll('#alpha-nav a');
                links.forEach(function (link) { link.classList.remove('active'); });
                e.target.classList.add('active');

                fetch('/api/movies/letter/' + encodeURIComponent(letter))
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        movieList.innerHTML = '';
                        endMessage.style.display = 'none';
                        allLoaded = false;
                        currentPage = Math.floor(data.offset / 20) + 1;
                        loading = false;
                        loadMovies();
                        window.scrollTo(0, 0);
                    });
            });
        })();
    </script>
</body>
</html>
